services:
  app:
    build: .
    container_name: psychologist-app
    working_dir: /var/www/html
    ports:
      - "12200:5173"
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - database
    networks:
      - psychologist

  nginx:
    image: nginx:alpine
    container_name: psychologist-nginx
    ports:
      - "12100:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - psychologist

  database:
    image: mariadb:10.11
    container_name: psychologist-db
    environment:
      MYSQL_DATABASE: psychologist
      MYSQL_USER: psychologist
      MYSQL_PASSWORD: psychologist
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - psychologist

volumes:
  db_data:

networks:
  psychologist:
    driver: bridge